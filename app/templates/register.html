<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <meta charset="utf-8" />
        <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/logo.webp') }}">
        <title>Energy Trade Platform - Register</title>
        <meta name="description" content="Register to Energy Trade Platform to buy and sell electric power" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/signin.css') }}" />
        <link rel="stylesheet" href="{{ url_for('static', filename='css/flash.css') }}" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    </head>
    <body>
        <div class="flash-container"></div>
        <main class="login">
            <aside class="login__hero" role="img" aria-label="Electric power transmission tower">
                <img
                    class="login__hero-image"
                    src="{{ url_for('static', filename='images/login.webp') }}"
                    alt="Electric power transmission infrastructure"
                />
                <div class="login__hero-overlay"></div>
            </aside>
            <section class="login__container">
                <div class="login__card">
                    <header class="login__header">
                        <h1 class="login__title">
                            <span class="login__title-welcome">Welcome to<br /></span>
                            <span class="login__title-brand">Energy Trade Platform</span>
                        </h1>
                        <nav class="login__nav" aria-label="Account navigation">
                            <p class="login__signup-link">
                                <span class="login__signup-text">Already have an account?</span>
                                <span class="login__signup-space">&nbsp;</span>
                                <a href="{{ url_for('auth.signin') }}" class="login__signup-action">Sign in</a>
                            </p>
                        </nav>
                    </header>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% if messages %}
                        <div class="flash-messages">
                          {% for category, message in messages %}
                            <div class="flash-message {{ category }}" role="alert">
                              <div class="flash-message-content">{{ message }}</div>
                              <button type="button" class="flash-message-close" onclick="this.parentElement.remove()">&times;</button>
                            </div>
                          {% endfor %}
                        </div>
                      {% endif %}
                    {% endwith %}
                    <p class="login__subtitle">Register to Buy and Sell Electric Power</p>
                    <form class="login__form" action="#" method="post" onsubmit="return validatePasswords()" novalidate>
                        <div class="login__form-group">
                            <label for="username" class="login__label">Username</label>
                            <input
                                type="text"
                                id="username"
                                name="username"
                                class="login__input"
                                required
                                autocomplete="username"
                                aria-required="true"
                                placeholder=""
                            />
                        </div>
                        <div class="login__form-group">
                            <label for="email" class="login__label">Email Address</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="login__input"
                                required
                                autocomplete="email"
                                aria-required="true"
                                placeholder=""
                            />
                        </div>
                        <div class="login__form-group">
                            <label for="password1" class="login__label">Password</label>
                            <div class="password-container">
                                <input
                                    type="password"
                                    id="password1"
                                    name="password1"
                                    class="login__input"
                                    required
                                    autocomplete="new-password"
                                    aria-required="true"
                                    placeholder=""
                                />
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password1', this)"><span class="fa-solid fa-eye-slash"></span></button>
                            </div>
                        </div>
                        <div class="login__form-group">
                            <label for="password2" class="login__label">Confirm Password</label>
                            <p id="help-text"></p>
                            <div class="password-container">
                                <input
                                    type="password"
                                    id="password2"
                                    name="password2"
                                    class="login__input"
                                    required
                                    autocomplete="new-password"
                                    aria-required="true"
                                    placeholder=""
                                />
                                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password2', this)"><span class="fa-solid fa-eye-slash"></span></button>
                            </div>
                        </div>
                        <p id="password-error" style="color: red;"></p>
                        <div class="login__actions">
                            <button type="submit" class="login__button login__button--primary">
                                <span class="login__button-text">Register</span>
                            </button>
                            <button type="button" class="signin_cancel_button">Cancel</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
        <script>
            function validatePassword(password) {
                const minLength = 8;
                const hasUpperCase = /[A-Z]/.test(password);
                const hasLowerCase = /[a-z]/.test(password);
                const hasNumbers = /\d/.test(password);
                const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);
                
                const errors = [];
                if (password.length < minLength) errors.push(`At least ${minLength} characters`);
                if (!hasUpperCase) errors.push('One uppercase letter');
                if (!hasLowerCase) errors.push('One lowercase letter');
                if (!hasNumbers) errors.push('One number');
                if (!hasSpecialChar) errors.push('One special character');
                
                return {
                    isValid: errors.length === 0,
                    errors: errors
                };
            }

            function updateSubmitButton() {
                const username = document.getElementById('username').value.trim();
                const email = document.getElementById('email').value.trim();
                const password1 = document.getElementById('password1').value;
                const password2 = document.getElementById('password2').value;
                const submitButton = document.querySelector('.login__button--primary');
                
                const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
                const passwordValidation = validatePassword(password1);
                const passwordsMatch = password1 === password2;
                
                const isFormValid = username.length > 0 && 
                                  isEmailValid && 
                                  passwordValidation.isValid && 
                                  passwordsMatch;
                
                submitButton.disabled = !isFormValid;
                submitButton.style.opacity = isFormValid ? '1' : '0.5';
            }

            function validatePasswords() {
                const password1 = document.getElementById('password1').value;
                const password2 = document.getElementById('password2').value;
                const errorMessage = document.getElementById('password-error');
                const validation = validatePassword(password1);

                if (!validation.isValid) {
                    errorMessage.innerHTML = 'Password requirements:<br>' + validation.errors.join('<br>');
                    return false;
                }

                if (password1 !== password2) {
                    errorMessage.textContent = 'Passwords do not match';
                    return false;
                }

                errorMessage.textContent = '';
                return true;
            }

            function togglePasswordVisibility(passwordFieldId, toggleButton) {
                const passwordField = document.getElementById(passwordFieldId);
                const icon = toggleButton.querySelector('span');
                
                if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                    toggleButton.setAttribute('aria-label', 'Hide password');
                } else {
                    passwordField.type = 'password';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                    toggleButton.setAttribute('aria-label', 'Show password');
                }
            }

            const password1 = document.getElementById('password1');
            const password2 = document.getElementById('password2');
            const helpText = document.getElementById('help-text');
            const username = document.getElementById('username');
            const email = document.getElementById('email');

            // Add event listeners for real-time validation
            [username, email, password1, password2].forEach(input => {
                input.addEventListener('input', updateSubmitButton);
            });

            password1.addEventListener('input', function() {
                const validation = validatePassword(this.value);
                const errorMessage = document.getElementById('password-error');
                
                if (!validation.isValid) {
                    errorMessage.innerHTML = 'Password requirements:<br>' + validation.errors.join('<br>');
                    errorMessage.style.color = 'red';
                } else {
                    errorMessage.innerHTML = 'Password meets all requirements';
                    errorMessage.style.color = 'green';
                }
                
                if (password2.value) {
                    if (this.value !== password2.value) {
                        helpText.textContent = 'Passwords do not match';
                        helpText.style.color = 'red';
                    } else {
                        helpText.textContent = 'Passwords match';
                        helpText.style.color = 'green';
                    }
                }
            });

            password2.addEventListener('input', function() {
                if (password1.value !== this.value) {
                    this.setCustomValidity('Passwords do not match');
                    helpText.textContent = 'Passwords do not match';
                    helpText.style.color = 'red';
                } else {
                    this.setCustomValidity('');
                    helpText.textContent = 'Passwords match';
                    helpText.style.color = 'green';
                }
                
                const errorMessage = document.getElementById('password-error');
                const validation = validatePassword(password1.value);
                if (validation.isValid && this.value === password1.value) {
                    errorMessage.textContent = 'All requirements met';
                    errorMessage.style.color = 'green';
                }
            });
        </script>

    </body>
</html>
